# Supabase project configuration for the Scavenger Hunt database.
# Run the CLI from the backend/ folder:
#   supabase start
#   supabase db reset
#
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "challenge-scavenger-hunt"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

# Allow anonymous sign-ins so teams can join without full accounts.
[auth.anonymous]
enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
